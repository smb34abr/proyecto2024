<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBook - Easy Tutorial YouTube Channel</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav>

        <div class="nav-left">
            <img src="img/logo.png" alt="Logo del sitio" class="logo">
            <ul>
                <li><img src="img/notification.png" alt=""></li>
                <li><img src="img/inbox.png" alt=""></li>
                <li><img src="img/video.png" alt=""></li>
            </ul>
        </div>

        <div class="nav-right">
            <div class="search-box">
                <img src="img/search.png" alt="Lupa de busqueda">
                <input type="text" placeholder="Search..">
            </div>
            <div class="nav-user-icon online">
                <img src="img/profile-pic.png" alt="">
            </div>
        </div>
    </nav>

    <div class="container">
        <!---------- left-sidebar ---------->
        <div class="left-sidebar">
            <div class="imp-links">
                <a href="#"><img src="img/news.png" alt="">Latest News</a>
                <a href="#"><img src="img/friends.png" alt="">Friends</a>
                <a href="#"><img src="img/group.png" alt="">Group</a>
                <a href="#"><img src="img/marketplace.png" alt="">marketplace</a>
                <a href="#"><img src="img/watch.png" alt="">Watch</a>
                <a href="#">See More..</a>
            </div>
            <div class="shortcut-links">
                <p>Your Shorts</p>
                <a href="#"><img src="img/shortcut-1.png" alt="">Web Developers</a>
                <a href="#"><img src="img/shortcut-2.png" alt="">Web Design course</a>
                <a href="#"><img src="img/shortcut-3.png" alt="">Full Stack Development</a>
                <a href="#"><img src="img/shortcut-4.png" alt="">Website Experts</a>
            </div>
        </div>
        
        <!---------- main-content ---------->
        <div class="main-content"></div>

        <!---------- right-sidebar ---------->
        <div class="right-sidebar">
            <div class="sidebar-title">
                <h4>Events</h4>
                <a href="#">See All</a>
            </div>
        </div>
    </div>































    <!-- JS -->
    <script src="js/scripts.js"></script>
</body>

</html>
